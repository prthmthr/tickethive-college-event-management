{% extends "base.html" %}
{% block title %}Log in | TicketHive{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-3">Log in</h1>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" maxlength="255" autocomplete="email" value="{{ request.form.get('email', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary password-toggle" type="button" data-password-target="password" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="mt-3 mb-0 text-center">Need an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>
{% endblock %}
